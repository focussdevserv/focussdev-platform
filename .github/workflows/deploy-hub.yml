name: Deploy Focussdev Hub

on:
  push:
    branches: [main]
    paths:
      - "hub/**"
      - ".github/workflows/deploy-hub.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focussdev-hub-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.135.0 pages deploy hub
          --project-name focussdev-hub
          --branch main
