name: Publish Integration Service

on:
  push:
    branches: [main]
    paths:
      - "services/integration-service/**"
      - ".github/workflows/publish-integration-service.yml"
    tags:
      - "integration-service-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: services/integration-service/pnpm-lock.yaml
      - name: Install
        working-directory: services/integration-service
        run: pnpm install --frozen-lockfile
      - name: Verify
        working-directory: services/integration-service
        run: |
          pnpm typecheck
          pnpm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/focussdevserv/focussdev-integration-service
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}
            type=match,pattern=integration-service-v(.*),group=1
      - uses: docker/build-push-action@v6
        with:
          context: services/integration-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Export deploy artifact
        uses: docker/build-push-action@v6
        with:
          context: services/integration-service
          outputs: type=docker,dest=/tmp/focussdev-integration-service.tar
          tags: ghcr.io/focussdevserv/focussdev-integration-service:main
          labels: ${{ steps.meta.outputs.labels }}
      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: focussdev-integration-service-image
          path: /tmp/focussdev-integration-service.tar
          retention-days: 7
          compression-level: 0
