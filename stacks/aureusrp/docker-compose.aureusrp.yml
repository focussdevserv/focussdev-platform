version: '3.9'

services:
  aureusrp:
    image: frappe/erpnext:v15
    container_name: focussdev_aureusrp
    restart: unless-stopped

    environment:
      # ERPNext/Frappe
      FRAPPE_APP_INIT: erpnext
      FRAPPE_USER: Administrator
      FRAPPE_ADMIN_PASSWORD: ${FRAPPE_ADMIN_PASSWORD}
      SITE_NAME: erp.focussdev.space

      # PostgreSQL
      DB_HOST: aureusrp-db
      DB_PORT: 5432
      DB_NAME: aureusrp_db
      DB_USER: aureusrp_user
      DB_PASSWORD: ${AUREUSRP_DB_PASSWORD}

      # Redis
      REDIS_CACHE: redis://aureusrp-redis:6379/0
      REDIS_QUEUE: redis://aureusrp-redis:6379/1
      REDIS_SOCKETIO: redis://aureusrp-redis:6379/2

      # Authentik OIDC
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_DISCOVERY_URL: https://auth.focussdev.space/.well-known/openid-configuration

      # Supabase
      SUPABASE_URL: https://supabase.focussdev.space
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}

      # Ambiente
      NODE_ENV: production
      LOG_LEVEL: info

    ports:
      - "3001:3000"

    volumes:
      - aureusrp-data:/home/frappe/frappe-bench/sites
      - aureusrp-logs:/home/frappe/frappe-bench/logs

    depends_on:
      - aureusrp-db
      - aureusrp-redis

    networks:
      - focussdev-network

    labels:
      traefik.enable: "true"
      traefik.http.routers.aureusrp.rule: Host(`erp.focussdev.space`)
      traefik.http.routers.aureusrp.entrypoints: websecure
      traefik.http.routers.aureusrp.tls.certresolver: letsencrypt
      traefik.http.services.aureusrp.loadbalancer.server.port: "8000"
      traefik.http.services.aureusrp.loadbalancer.healthcheck.path: /api/health
      traefik.http.services.aureusrp.loadbalancer.healthcheck.interval: 30s

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  aureusrp-db:
    image: postgres:17.6-alpine
    container_name: focussdev_aureusrp-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: aureusrp_user
      POSTGRES_PASSWORD: ${AUREUSRP_DB_PASSWORD}
      POSTGRES_DB: aureusrp_db

    volumes:
      - aureusrp-db-data:/var/lib/postgresql/data

    networks:
      - focussdev-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aureusrp_user -d aureusrp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  aureusrp-redis:
    image: redis:7-alpine
    container_name: focussdev_aureusrp-redis
    restart: unless-stopped

    volumes:
      - aureusrp-redis-data:/data

    networks:
      - focussdev-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  aureusrp-backup:
    image: alpine:3.20
    container_name: focussdev_aureusrp-backup
    restart: unless-stopped

    entrypoint: |
      sh -c "
      apk add --no-cache postgresql-client gzip tar
      while true; do
        STAMP=\$(date -u +%Y%m%dT%H%M%SZ)
        BACKUP_DIR=/backups/\$STAMP
        mkdir -p \$BACKUP_DIR

        # Backup Postgres
        pg_dump -h aureusrp-db -U aureusrp_user -d aureusrp_db | gzip -9 > \$BACKUP_DIR/aureusrp-postgres.sql.gz

        # Backup ERPNext sites
        tar czf \$BACKUP_DIR/aureusrp-sites.tar.gz /sites 2>/dev/null || true

        echo \"✅ Backup em \$BACKUP_DIR\"

        # Manter últimos 30 dias
        find /backups -type d -mtime +30 -exec rm -rf {} + 2>/dev/null || true

        # Daily backup
        sleep 86400
      done
      "

    volumes:
      - aureusrp-db-data:/backups-source:ro
      - aureusrp-data:/sites:ro
      - /var/backups/focussdev/aureusrp:/backups

    depends_on:
      - aureusrp-db

    networks:
      - focussdev-network

volumes:
  aureusrp-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/data/focussdev/aureusrp/sites

  aureusrp-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/logs/focussdev/aureusrp

  aureusrp-db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/data/focussdev/aureusrp/postgres

  aureusrp-redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/data/focussdev/aureusrp/redis

networks:
  focussdev-network:
    external: true
