version: '3.9'

services:
  freescout:
    image: freescout/freescout:latest
    container_name: focussdev_freescout
    restart: unless-stopped

    environment:
      APP_URL: https://suporte.focussdev.space
      APP_NAME: "Focussdev Suporte"
      APP_KEY: base64:${FREESCOUT_APP_KEY}

      DB_HOST: freescout-db
      DB_USER: freescout_user
      DB_PASSWORD: ${FREESCOUT_DB_PASSWORD}
      DB_DATABASE: freescout_db

      MAIL_DRIVER: smtp
      MAIL_HOST: ${MAIL_HOST:-smtp.mailtrap.io}
      MAIL_FROM_NAME: "Focussdev"

      APP_LOG: single
      APP_DEBUG: "false"

    ports:
      - "3006:80"

    volumes:
      - freescout-storage:/app/storage
      - freescout-logs:/app/logs

    depends_on:
      - freescout-db

    networks:
      - focussdev-network

    labels:
      traefik.enable: "true"
      traefik.http.routers.freescout.rule: Host(`suporte.focussdev.space`)
      traefik.http.routers.freescout.entrypoints: websecure
      traefik.http.routers.freescout.tls.certresolver: letsencrypt
      traefik.http.services.freescout.loadbalancer.server.port: "80"

  freescout-db:
    image: mysql:8-alpine
    container_name: focussdev_freescout-db
    restart: unless-stopped
    environment:
      MYSQL_USER: freescout_user
      MYSQL_PASSWORD: ${FREESCOUT_DB_PASSWORD}
      MYSQL_DATABASE: freescout_db
      MYSQL_ROOT_PASSWORD: ${FREESCOUT_DB_ROOT_PASSWORD}
    volumes:
      - freescout-db-data:/var/lib/mysql
    networks:
      - focussdev-network

volumes:
  freescout-storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/data/focussdev/freescout/storage
  freescout-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/logs/focussdev/freescout
  freescout-db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/data/focussdev/freescout/mysql

networks:
  focussdev-network:
    external: true
